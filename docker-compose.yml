# Looking Glass + PostgreSQL (standard setup).
#   1. cp .env.example .env   and fill it in
#   2. docker compose up -d
# More variants are in ./examples (HTTPS for passkeys, external PostgreSQL, Unraid socket proxy, build from source).
services:
  looking-glass:
    image: ghcr.io/gittimeraider/looking-glass:latest
    container_name: looking-glass
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lookingglass:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/lookingglass
    ports:
      - "8080:8080"        # web UI
      - "514:5514/udp"     # syslog from OPNsense (UDP)
      - "514:5514/tcp"     # syslog from OPNsense (TCP)
      - "9200:9200"        # Zenarmor "Stream Reporting Data to External Elasticsearch" (free edition)
    volumes:
      - ./data:/data       # optional: GeoLite2-City.mmdb
    logging:               # reset codes are printed to this log - keep a few MB of it
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  db:
    image: postgres:18-alpine
    container_name: looking-glass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ layout (data lives in /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
