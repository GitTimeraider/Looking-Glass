{% extends "base.html" %}
{% block head %}
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
{% endblock %}
{% block body %}
<header class="top">
  <h1 id="title">Report</h1>
  <a class="btn secondary noprint" href="/api/reports/{{ report_id }}/download">Download JSON</a>
  <button onclick="window.print()">Print / PDF</button>
</header>
<div id="ai-card" class="card" hidden style="margin-bottom:14px"><h3>AI analysis</h3>
  <div id="ai-state" class="small"></div><div id="ai" class="msg assistant" style="border:0"></div></div>
<div class="grid kpis" id="kpis"></div>
<div class="grid g2" style="margin-top:14px" id="sections"></div>
{% endblock %}
{% block scripts %}
<script>
const SECTIONS = [
  ["alerts", "Alerts", [{k: "severity", l: "Sev", f: LG.sev}, {k: "title", l: "Alert"}, {k: "count", l: "#", num: true}, {k: "status", l: "Status"}]],
  ["top_blocked_sources", "Top blocked sources", [{k: "ip", l: "IP"}, {k: "country", l: "Country", f: LG.flag}, {k: "ports", l: "Ports", num: true}, {k: "n", l: "Hits", num: true}]],
  ["top_blocked_ports", "Top blocked ports", [{k: "port", l: "Port"}, {k: "proto", l: "Proto"}, {k: "sources", l: "Sources", num: true}, {k: "n", l: "Hits", num: true}]],
  ["top_blocked_countries", "Blocked by country", [{k: "country", l: "Country", f: LG.flag}, {k: "ips", l: "IPs", num: true}, {k: "n", l: "Hits", num: true}]],
  ["top_passed_inbound", "Allowed inbound from internet", [{k: "dst", l: "Destination"}, {k: "port", l: "Port"}, {k: "proto", l: "Proto"}, {k: "sources", l: "Sources", num: true}, {k: "n", l: "Hits", num: true}]],
  ["auth_failures", "Authentication failures", [{k: "ip", l: "IP"}, {k: "source", l: "Service"}, {k: "users", l: "Users"}, {k: "n", l: "Failures", num: true}]],
  ["auth_success", "Successful logins", [{k: "username", l: "User"}, {k: "ip", l: "From"}, {k: "program", l: "Via"}, {k: "n", l: "#", num: true}]],
  ["ids_signatures", "Suricata signatures", [{k: "signature", l: "Signature"}, {k: "classification", l: "Class"}, {k: "n", l: "Hits", num: true}]],
  ["crowdsec_scenarios", "CrowdSec scenarios", [{k: "scenario", l: "Scenario"}, {k: "ips", l: "IPs", num: true}, {k: "n", l: "Events", num: true}]],
  ["qfeeds_hits", "Q-Feeds hits", [{k: "src", l: "Source"}, {k: "dst", l: "Destination"}, {k: "direction", l: "Dir"}, {k: "n", l: "Hits", num: true}]],
  ["zenarmor_top", "Zenarmor", [{k: "app", l: "App"}, {k: "action", l: "Action"}, {k: "n", l: "Events", num: true}]],
  ["web_status", "Web responses", [{k: "status", l: "Status"}, {k: "n", l: "Requests", num: true}]],
  ["web_attack_tags", "Web attack patterns", [{k: "tag", l: "Pattern"}, {k: "ips", l: "IPs", num: true}, {k: "n", l: "Requests", num: true}]],
  ["web_top_clients", "Web top clients", [{k: "ip", l: "IP"}, {k: "country", l: "Country", f: LG.flag}, {k: "errors", l: "Errors", num: true}, {k: "n", l: "Requests", num: true}]],
  ["dns_top_domains", "DNS top domains", [{k: "domain", l: "Domain"}, {k: "clients", l: "Clients", num: true}, {k: "n", l: "Queries", num: true}]],
  ["dns_blocked", "DNS blocked", [{k: "domain", l: "Domain"}, {k: "blocklist", l: "List"}, {k: "n", l: "Hits", num: true}]],
  ["dns_clients", "DNS clients", [{k: "client", l: "Client"}, {k: "blocked", l: "Blocked", num: true}, {k: "n", l: "Queries", num: true}]],
  ["top_talkers_internal", "Internal top talkers", [{k: "ip", l: "Host"}, {k: "peers", l: "Peers", num: true}, {k: "n", l: "Events", num: true}]],
  ["new_devices", "New devices", [{k: "mac", l: "MAC", f: LG.mac}, {k: "ip", l: "IP"}, {k: "hostname", l: "Hostname"}, {k: "conn_where", l: "Connected to"}, {k: "first_seen", l: "First seen", f: LG.time}]],
  ["clients_with_security_events", "Clients with security events (UniFi + OPNsense)", [{k: "name", l: "Device"}, {k: "ip", l: "IP"}, {k: "conn_where", l: "Connected to"}, {k: "fw", l: "FW blocks", num: true}, {k: "dns", l: "DNS blocked", num: true}, {k: "threats", l: "Threats", num: true}]],
  ["unifi_events", "UniFi events", [{k: "action", l: "Event"}, {k: "clients", l: "Clients", num: true}, {k: "n", l: "Count", num: true}]],
];
/* the AI analysis runs in the background: show progress, then the result - or why it failed, with Retry */
let aiStarted = Date.now();
function showAI(r) {
  const card = document.getElementById("ai-card"), st = document.getElementById("ai-state"), ai = document.getElementById("ai");
  card.hidden = !(r.ai_summary || r.ai_state);
  if (r.ai_state === "running") {
    st.innerHTML = `<span class="spinner"></span> The AI is analysing this report (usually 1-5 minutes; it looks into the data with its tools). This page updates by itself - you can also leave and come back.`;
    st.className = "small muted";
    setTimeout(async () => showAI(await LG.api("/api/reports/{{ report_id }}")), 5000);
  } else if (r.ai_state === "failed") {
    st.innerHTML = `<b>The AI analysis failed:</b> ${LG.esc(r.ai_error || "unknown error")}<div style="margin-top:8px"><button id="ai-retry">Retry AI analysis</button> <a class="btn secondary" href="/settings#ai">AI settings</a></div>`;
    st.className = "small err";
    document.getElementById("ai-retry").onclick = async () => {
      await LG.api("/api/reports/{{ report_id }}/ai", { method: "POST" }); aiStarted = Date.now();
      showAI(await LG.api("/api/reports/{{ report_id }}"));
    };
  } else { st.innerHTML = ""; }
  ai.innerHTML = r.ai_summary ? LG.md(r.ai_summary) : "";
  ai.hidden = !r.ai_summary;
}
(async () => {
  const r = await LG.api("/api/reports/{{ report_id }}");
  const d = r.data;
  document.getElementById("title").textContent = `${r.title} — ${LG.time(r.created_at)}`;
  document.title = r.title;
  showAI(r);
  const tot = d.totals || {}, fa = Object.fromEntries((d.firewall_actions || []).map(x => [x.action, x.n]));
  const sev = Object.fromEntries((d.alerts_by_severity || []).map(x => [x.severity, x.n]));
  const k = (l, v) => `<div class="card kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  document.getElementById("kpis").innerHTML = k("Events", LG.num(Object.values(tot).reduce((a, b) => a + b, 0))) + k("FW blocked", LG.num(fa.block || 0)) +
    k("FW passed (logged)", LG.num(fa.pass || 0)) + k("Critical/high alerts", LG.num((sev.critical || 0) + (sev.high || 0))) +
    k("Medium alerts", LG.num(sev.medium || 0)) + k("DNS queries", LG.num(tot.unbound || 0)) + k("Web requests", LG.num(tot.nginx || 0));
  const box = document.getElementById("sections");
  for (const [key, title, cols] of SECTIONS) {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<h3>${title}</h3><div></div>`; box.appendChild(c);
    LG.table(c.lastElementChild, cols, d[key] || []);
  }
  document.querySelectorAll(".table-wrap").forEach(w => w.classList.add("tall"));
})();
</script>
{% endblock %}
