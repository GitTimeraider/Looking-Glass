{% extends "base.html" %}
{% block body %}
<header class="top">
  <h1>Security dashboard</h1>
  <span class="muted small" id="updated"></span>
  <button type="button" class="secondary small-btn" id="customize" title="Add, remove, move and resize widgets">Customize</button>
  <div class="seg" id="range">
    <button data-v="1">1h</button><button data-v="24">24h</button><button data-v="168">7d</button><button data-v="720">30d</button>
  </div>
</header>

<div class="layout-bar" id="layout-bar" hidden>
  <b>Customize the overview</b>
  <span class="muted small">Drag widgets to move them (or use ◀ ▶), change width / height, remove with ✕.</span>
  <span class="sp"></span>
  <select id="add-widget"><option value="">+ Add widget…</option></select>
  <button type="button" class="secondary" id="layout-reset">Reset to default</button>
  <button type="button" class="secondary" id="layout-cancel">Cancel</button>
  <button type="button" id="layout-save">Done</button>
</div>
<div class="grid g3 widgets" id="widgets"></div>
{% endblock %}

{% block scripts %}
<script>
let hours = Number(localStorage.getItem("lg-hours") || 24);

/* ---------------- widgets: what the overview can show (default order / size = the default layout) ---------------- */
// body: "kpis", "chart" (canvas c-<el>), "table" (div t-<el>) or "html" (div <el>); src: optional source (hidden when off)
const WIDGETS = [
  { id: "kpis", title: "Key figures", w: 3, body: "kpis", el: "kpis" },
  { id: "timeline", title: "Events over time", w: 2, body: "chart", el: "timeline" },
  { id: "sources", title: "Events by source", w: 1, body: "chart", el: "sources", sort: "sources" },
  { id: "alerts", title: "Open alerts", w: 3, body: "table", el: "alerts", link: ["/alerts", "all alerts →"] },
  { id: "sys", title: "Firewall system", w: 1, body: "html", el: "sys", optional: true },
  { id: "blocked-src", title: "Top blocked sources", w: 1, body: "table", el: "blocked-src" },
  { id: "blocked-ports", title: "Top blocked ports", w: 1, body: "table", el: "blocked-ports" },
  { id: "countries", title: "Blocked by country", w: 1, body: "table", el: "countries" },
  { id: "pass-in", title: "Allowed inbound from internet", w: 1, body: "table", el: "pass-in" },
  { id: "auth", title: "Auth failures", w: 1, body: "table", el: "auth" },
  { id: "auth-ok", title: "Successful logins", w: 1, body: "table", el: "auth-ok" },
  { id: "dns", title: "DNS top domains", w: 1, body: "table", el: "dns", src: "unbound" },
  { id: "dns-blocked", title: "DNS blocked", w: 1, body: "table", el: "dns-blocked", src: "unbound" },
  { id: "dns-clients", title: "DNS clients", w: 1, body: "table", el: "dns-clients", src: "unbound" },
  { id: "web", title: "Web (nginx) responses", w: 1, body: "chart", el: "web", src: "nginx", sort: "web", small: true },
  { id: "web-tags", title: "Web attack patterns", w: 1, body: "table", el: "web-tags", src: "nginx" },
  { id: "web-clients", title: "Web top clients", w: 1, body: "table", el: "web-clients", src: "nginx" },
  { id: "ids", title: "Suricata signatures", w: 1, body: "table", el: "ids", src: "suricata" },
  { id: "ids-src", title: "Suricata: top sources", w: 1, body: "table", el: "ids-src", src: "suricata", optional: true },
  { id: "ids-dst", title: "Suricata: targeted hosts", w: 1, body: "table", el: "ids-dst", src: "suricata", optional: true },
  { id: "ids-cls", title: "Suricata classifications", w: 1, body: "table", el: "ids-cls", src: "suricata", optional: true },
  { id: "ids-int", title: "Suricata: internal hosts alerting", w: 1, body: "table", el: "ids-int", src: "suricata", optional: true },
  { id: "cs", title: "CrowdSec scenarios", w: 1, body: "table", el: "cs", src: "crowdsec" },
  { id: "qf", title: "Q-Feeds threat-intel hits", w: 1, body: "table", el: "qf", src: "qfeeds" },
  { id: "talkers", title: "Internal top talkers", w: 1, body: "table", el: "talkers" },
  { id: "devices", title: "New devices", w: 1, body: "table", el: "devices" },
  // optional: not in the default layout, picked under Customize › Add widget (grouped there by "group")
  { id: "threat-blocks", title: "Threat blocks by source", w: 1, body: "chart", el: "threat-blocks", optional: true, group: "Threats" },
  { id: "cs-ips", title: "CrowdSec firewall: top blocked IPs", w: 1, body: "table", el: "cs-ips", src: "crowdsec", optional: true, group: "Threats" },
  { id: "ids-drop", title: "Suricata: dropped signatures", w: 1, body: "table", el: "ids-drop", src: "suricata", optional: true, group: "Threats" },
  { id: "sec-clients", title: "Devices with security events", w: 2, body: "table", el: "sec-clients", optional: true, group: "Threats" },
  { id: "unifi-now", title: "UniFi devices now", w: 1, body: "table", el: "unifi-now", src: "unifi", optional: true, group: "UniFi", link: ["/unifi", "UniFi →"] },
  { id: "unifi-dev", title: "UniFi: devices offline / restarted", w: 1, body: "table", el: "unifi-dev", src: "unifi", optional: true, group: "UniFi" },
  { id: "unifi-clients", title: "UniFi: Wi-Fi clients dropping / roaming", w: 1, body: "table", el: "unifi-clients", src: "unifi", optional: true, group: "UniFi" },
  { id: "unraid-storage", title: "Unraid storage", w: 2, body: "table", el: "unraid-storage", src: "unraid", optional: true, group: "Unraid", link: ["/unraid", "Unraid →"] },
  { id: "unraid-res", title: "Unraid CPU / memory", w: 1, body: "table", el: "unraid-res", src: "unraid", optional: true, group: "Unraid" },
  { id: "unraid-ctr", title: "Unraid containers: stopped / unhealthy", w: 1, body: "html", el: "unraid-ctr", src: "unraid", optional: true, group: "Unraid" },
  { id: "unraid-notif", title: "Unraid notifications", w: 2, body: "table", el: "unraid-notif", src: "unraid", optional: true, group: "Unraid" },
  { id: "unraid-logs", title: "Unraid container log errors", w: 1, body: "table", el: "unraid-logs", src: "unraid", optional: true, group: "Unraid" },
  { id: "backup-jobs", title: "Backup jobs", w: 2, body: "table", el: "backup-jobs", src: "backups", optional: true, group: "Backups", link: ["/backups", "Backups →"] },
];
// the group of the older widgets, for the Add widget list
const GROUP_OF_SRC = { suricata: "Threats", crowdsec: "Threats", qfeeds: "Threats", unbound: "DNS", nginx: "Web server" };
const groupOf = w => w.group || GROUP_OF_SRC[w.src] || "Firewall & general";
const BY_ID = Object.fromEntries(WIDGETS.map(w => [w.id, w]));
const DEFAULT_LAYOUT = WIDGETS.filter(w => !w.optional).map(w => ({ id: w.id, w: w.w, h: 1 }));
let layout = DEFAULT_LAYOUT, saved = null, editing = false, srcOn = {};

function cleanLayout(l) {
  const seen = new Set();
  return (Array.isArray(l) ? l : []).filter(x => x && BY_ID[x.id] && !seen.has(x.id) && seen.add(x.id))
    .map(x => ({ id: x.id, w: Math.min(3, Math.max(1, Number(x.w) || 1)), h: Number(x.h) === 2 ? 2 : 1 }));
}
function body(def) {
  if (def.body === "kpis") return `<div class="grid kpis" id="kpis"></div>`;
  if (def.body === "chart") return `<div class="chart-box${def.small ? " sm" : ""}"><canvas id="c-${def.el}"></canvas></div>`;
  return `<div id="${def.body === "table" ? "t-" : ""}${def.el}"></div>`;
}
function build() {
  const grid = document.getElementById("widgets");
  grid.classList.toggle("editing", editing);
  grid.innerHTML = layout.map((it, i) => {
    const def = BY_ID[it.id];
    const tools = editing ? `<span class="w-tools">
        <button type="button" data-act="left" title="Move left / up" ${i === 0 ? "disabled" : ""}>◀</button>
        <button type="button" data-act="right" title="Move right / down" ${i === layout.length - 1 ? "disabled" : ""}>▶</button>
        <button type="button" data-act="width" title="Width: ⅓, ⅔ or the whole row">↔ ${it.w}/3</button>
        <button type="button" data-act="height" title="Height: normal or tall">↕ ${it.h === 2 ? "tall" : "normal"}</button>
        <button type="button" data-act="remove" title="Remove this widget">✕</button></span>` : "";
    const head = def.body === "kpis" && !editing ? "" :
      `<h3>${editing ? `<span class="w-grip" title="Drag to move">⠿</span>` : ""}${LG.esc(def.title)}${def.sort ? `<span data-sort-slot="${def.sort}"></span>` : ""}` +
      `<span class="sp"></span>${def.link && !editing ? `<a href="${def.link[0]}" class="small">${def.link[1]}</a>` : ""}${tools}</h3>`;
    const cls = ["card", "widget", it.w === 3 ? "span3" : it.w === 2 ? "span2" : "", it.h === 2 ? "tall" : "", def.body === "kpis" && !editing ? "bare" : ""].join(" ");
    return `<div class="${cls}" data-wid="${it.id}" ${def.src ? `data-src="${def.src}"` : ""} ${editing ? 'draggable="true"' : ""}>${head}${body(def)}</div>`;
  }).join("");
  grid.querySelectorAll("[data-sort-slot]").forEach(slot => slot.replaceWith({ sources: sortSources, web: sortWeb }[slot.dataset.sortSlot].el));
  applySources();
  if (editing) wireEditing(grid);
  // the add-widget list: everything not on the page, grouped
  const free = WIDGETS.filter(w => !layout.some(x => x.id === w.id)), groups = [...new Set(free.map(groupOf))];
  document.getElementById("add-widget").innerHTML = `<option value="">+ Add widget…</option>` + groups.map(g =>
    `<optgroup label="${LG.esc(g)}">` + free.filter(w => groupOf(w) === g).map(w => `<option value="${w.id}">${LG.esc(w.title)}</option>`).join("") +
    `</optgroup>`).join("");
  if (last) render(last);
}
function applySources() {
  // widgets of optional sources that are switched off (Settings › OPNsense) and sent nothing are hidden (not in edit mode)
  document.querySelectorAll("#widgets [data-src]").forEach(c => c.hidden = !editing && srcOn[c.dataset.src] === false);
}
function wireEditing(grid) {
  grid.querySelectorAll("[data-act]").forEach(b => b.onclick = e => {
    const id = b.closest("[data-wid]").dataset.wid, i = layout.findIndex(x => x.id === id), it = layout[i];
    const act = b.dataset.act;
    if (act === "left" && i > 0) [layout[i - 1], layout[i]] = [layout[i], layout[i - 1]];
    if (act === "right" && i < layout.length - 1) [layout[i + 1], layout[i]] = [layout[i], layout[i + 1]];
    if (act === "width") it.w = it.w % 3 + 1;
    if (act === "height") it.h = it.h === 2 ? 1 : 2;
    if (act === "remove") layout.splice(i, 1);
    build();
  });
  let dragged = null;
  grid.querySelectorAll("[data-wid]").forEach(card => {
    card.ondragstart = e => { dragged = card.dataset.wid; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
    card.ondragend = () => { card.classList.remove("dragging"); grid.querySelectorAll(".drop-before,.drop-after").forEach(c => c.classList.remove("drop-before", "drop-after")); };
    card.ondragover = e => {
      if (!dragged || dragged === card.dataset.wid) return;
      e.preventDefault();
      const r = card.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
      card.classList.toggle("drop-after", after); card.classList.toggle("drop-before", !after);
    };
    card.ondragleave = () => card.classList.remove("drop-before", "drop-after");
    card.ondrop = e => {
      e.preventDefault();
      const after = card.classList.contains("drop-after");
      const from = layout.findIndex(x => x.id === dragged), item = layout.splice(from, 1)[0];
      let to = layout.findIndex(x => x.id === card.dataset.wid) + (after ? 1 : 0);
      layout.splice(to, 0, item);
      dragged = null;
      build();
    };
  });
}
function setEditing(on) {
  editing = on;
  document.getElementById("layout-bar").hidden = !on;
  document.getElementById("customize").hidden = on;
  build();
}
document.getElementById("customize").onclick = () => { saved = JSON.parse(JSON.stringify(layout)); setEditing(true); };
document.getElementById("layout-cancel").onclick = () => { layout = saved || layout; setEditing(false); };
document.getElementById("layout-reset").onclick = () => { layout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT)); build(); };
document.getElementById("add-widget").onchange = e => {
  const def = BY_ID[e.target.value];
  if (def) layout.push({ id: def.id, w: def.w, h: 1 });
  build();
};
document.getElementById("layout-save").onclick = async () => {
  try {
    const isDefault = JSON.stringify(layout) === JSON.stringify(DEFAULT_LAYOUT);
    if (isDefault) await LG.api("/api/layout/overview", { method: "DELETE" });  // follow future default changes
    else await LG.api("/api/layout/overview", { method: "PUT", body: { layout } });
  } catch (err) { alert("Saving the layout failed: " + err.message); return; }
  setEditing(false);
};
LG.seg(document.getElementById("range"), hours, v => { hours = Number(v); localStorage.setItem("lg-hours", v); auto.touch(); load(); });

function kpi(label, value, cls = "") { return `<div class="card kpi ${cls}"><div class="v">${value}</div><div class="l">${LG.esc(label)}</div></div>`; }
const cnt = (v, r) => LG.num(v);
const SEV_RANK = ["info", "low", "medium", "high", "critical"];
// every table: click a header to sort; the rows arrive sorted by their count ("n"), which is marked
function T(sel, cols, rows, empty, order) {
  if (!document.querySelector(sel)) return;  // widget not on the page
  cols = cols.map(c => ({ ...c, l: c.l || (c.f === LG.flag ? "Country" : ""), desc: c.f === LG.ago || c.f === LG.time,
                          ...(c.f === LG.sev ? { s: r => SEV_RANK.indexOf(r.severity), desc: true } : {}) }));
  LG.table(sel, cols, rows, empty, undefined, { sortAll: true, order: order === undefined ? (cols.some(c => c.k === "n") ? { k: "n", dir: -1 } : null) : order });
}
// charts with an order toggle ("most first" / "fewest first" / A-Z)
let last = null;
const sortSources = LG.sortToggle("overview:sources", () => last && drawSources(last.report));
const sortWeb = LG.sortToggle("overview:web", () => last && drawWeb(last.report));
function drawSources(r) {
  const tot = LG.sortRows(r.totals_by_source.map(x => ({ label: x.source, v: x.n })), sortSources.mode());
  LG.chart("c-sources", { type: "doughnut", data: { labels: tot.map(x => x.label),
    datasets: [{ data: tot.map(x => x.v), backgroundColor: tot.map(x => LG.sourceColors[x.label] || "#64748b"), borderWidth: 0 }] },
    options: { maintainAspectRatio: false, animation: false, plugins: { legend: { position: "right", labels: { boxWidth: 10 } } } } });
}
function drawWeb(r) {
  const ws = LG.sortRows(r.web_status.map(x => ({ label: x.status.replace("http_", ""), v: x.n })), sortWeb.mode());
  LG.chart("c-web", { type: "bar", data: { labels: ws.map(x => x.label),
    datasets: [{ data: ws.map(x => x.v), backgroundColor: ws.map(x => /^5/.test(x.label) ? "#ef4444" : /^4/.test(x.label) ? "#f59e0b" : "#22c55e") }] },
    options: { maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } } } });
}

const $ = id => document.getElementById(id);
async function load() {
  let d;
  try { d = await LG.api(`/api/overview?hours=${hours}`, { signal: LG.latest("overview") }); }
  catch (e) { if (!LG.aborted(e)) document.getElementById("updated").textContent = "Failed to load: " + e.message; return; }
  // 7 / 30 days never counted yet: the server counts it in the background; what is shown belongs to another period
  $("widgets").classList.toggle("pending-period", !!d.pending);
  if (d.pending) { LG.updated($("updated"), d, load, VIEW()); return; }
  last = d;
  render(d);
}
const VIEW = () => ({ kind: "overview", hours });
function render(d) {
  const k = d.kpi, oa = k.open_alerts || {}, on = d.sources || {};
  srcOn = on;
  applySources();
  const crit = (oa.critical || 0) + (oa.high || 0);
  const openTotal = Object.values(oa).reduce((a, b) => a + b, 0);
  if ($("kpis")) $("kpis").innerHTML =
    kpi("Events", LG.num(k.total)) +
    kpi("Blocked", LG.num(k.blocked), k.blocked ? "warn" : "") +
    kpi("Blocked IPs", LG.num(k.blocked_ips)) +
    kpi("Open alerts", `${openTotal}${crit ? ` <span class="small" style="color:var(--bad)">(${crit} high+)</span>` : ""}`, crit ? "bad" : openTotal ? "warn" : "ok") +
    kpi("Login failures", LG.num(k.login_failed), k.login_failed ? "warn" : "") +
    (on.suricata ? kpi("Suricata dropped", LG.num(k.ids_dropped), k.ids_dropped ? "warn" : "") : "") +
    (on.qfeeds ? kpi("Q-Feeds hits", LG.num(k.qfeeds), k.qfeeds ? "warn" : "") : "") +
    (on.crowdsec ? kpi("CrowdSec firewall blocks", LG.num(k.crowdsec_fw), k.crowdsec_fw ? "warn" : "") : "") +
    kpi("Devices (24h)", LG.num(k.devices));
  LG.updated(document.getElementById("updated"), d, load, VIEW());

  // timeline (stacked by source)
  const tl = d.timeline, buckets = [...new Set(tl.series.map(r => r.bucket))].sort();
  const sources = [...new Set(tl.series.map(r => r.source))];
  const idx = Object.fromEntries(buckets.map((b, i) => [b, i]));
  const ds = sources.map(s => {
    const data = new Array(buckets.length).fill(0);
    tl.series.filter(r => r.source === s).forEach(r => data[idx[r.bucket]] = r.n);
    return { label: s, data, backgroundColor: LG.sourceColors[s] || "#64748b", stack: "s" };
  });
  const labels = buckets.map(b => LG.timeLabel(b, hours));
  LG.chart("c-timeline", { type: "bar", data: { labels, datasets: ds },
    options: { maintainAspectRatio: false, animation: false, scales: { x: { stacked: true, ticks: { maxTicksLimit: 12 } }, y: { stacked: true } }, plugins: { legend: { position: "bottom", labels: { boxWidth: 10 } } } } });
  drawSources(d.report);

  const r = d.report;
  T("#t-alerts", [{k: "severity", l: "Sev", f: LG.sev}, {k: "title", l: "Alert", f: (v, row) => `<a href="/alerts#${row.id}">${LG.esc(v)}</a>`},
    {k: "count", l: "#", num: true}, {k: "last_seen", l: "Last", f: LG.ago}], r.alerts.filter(a => a.status === "open").slice(0, 12), "No open alerts 🎉", { k: "severity", dir: -1 });
  T("#t-blocked-src", [{k: "ip", l: "Source", f: LG.ip}, {k: "country", l: "", f: LG.flag}, {k: "ports", l: "Ports", num: true}, {k: "n", l: "Hits", num: true}], r.top_blocked_sources);
  T("#t-blocked-ports", [{k: "port", l: "Port"}, {k: "proto", l: "Proto"}, {k: "sources", l: "Sources", num: true}, {k: "n", l: "Hits", num: true}], r.top_blocked_ports);
  T("#t-countries", [{k: "country", l: "Country", f: LG.flag}, {k: "ips", l: "IPs", num: true}, {k: "n", l: "Hits", num: true}], r.top_blocked_countries, "No GeoIP data (see Setup)");
  T("#t-pass-in", [{k: "dst", l: "Destination", f: LG.ip}, {k: "port", l: "Port"}, {k: "proto", l: "Proto"}, {k: "sources", l: "Srcs", num: true}, {k: "n", l: "Hits", num: true}], r.top_passed_inbound, "None logged (enable logging on pass rules)");
  T("#t-auth", [{k: "ip", l: "Source", f: LG.ip}, {k: "source", l: "Svc"}, {k: "users", l: "Users"}, {k: "n", l: "Fails", num: true}], r.auth_failures, "No failed logins");
  T("#t-auth-ok", [{k: "username", l: "User"}, {k: "ip", l: "From", f: LG.ip}, {k: "program", l: "Via"}, {k: "last", l: "Last", f: LG.ago}], r.auth_success, undefined, { k: "last", dir: -1 });
  T("#t-dns", [{k: "domain", l: "Domain"}, {k: "clients", l: "Clients", num: true}, {k: "n", l: "Queries", num: true}], r.dns_top_domains);
  T("#t-dns-blocked", [{k: "domain", l: "Domain"}, {k: "blocklist", l: "List"}, {k: "n", l: "Hits", num: true}], r.dns_blocked);
  T("#t-dns-clients", [{k: "client", l: "Client", f: LG.ip}, {k: "blocked", l: "Blocked", num: true}, {k: "n", l: "Queries", num: true}], r.dns_clients);
  drawWeb(r);
  T("#t-web-tags", [{k: "tag", l: "Pattern"}, {k: "ips", l: "IPs", num: true}, {k: "n", l: "Requests", num: true}], r.web_attack_tags, "No attack patterns seen");
  T("#t-web-clients", [{k: "ip", l: "Client", f: LG.ip}, {k: "country", l: "", f: LG.flag}, {k: "errors", l: "4xx/5xx", num: true}, {k: "n", l: "Req", num: true}], r.web_top_clients);
  T("#t-ids", [{k: "signature", l: "Signature"}, {k: "sources", l: "Srcs", num: true}, {k: "n", l: "Hits", num: true}], r.ids_signatures, "No Suricata alerts");
  T("#t-ids-src", [{k: "ip", l: "Source", f: LG.ip}, {k: "country", l: "", f: LG.flag}, {k: "sigs", l: "Sigs", num: true}, {k: "n", l: "Hits", num: true}], r.ids_top_sources, "No Suricata alerts");
  T("#t-ids-dst", [{k: "ip", l: "Destination", f: LG.ip}, {k: "port", l: "Port"}, {k: "sources", l: "Srcs", num: true}, {k: "n", l: "Hits", num: true}], r.ids_top_targets, "No Suricata alerts");
  T("#t-ids-cls", [{k: "classification", l: "Classification"}, {k: "dropped", l: "Dropped", num: true}, {k: "n", l: "Hits", num: true}], r.ids_classifications, "No Suricata alerts");
  T("#t-ids-int", [{k: "ip", l: "Host", f: LG.ip}, {k: "sigs", l: "Sigs", num: true}, {k: "n", l: "Hits", num: true}], r.ids_internal_hosts, "No internal host triggered Suricata");
  T("#t-cs", [{k: "scenario", l: "Scenario"}, {k: "ips", l: "IPs", num: true}, {k: "n", l: "Events", num: true}], r.crowdsec_scenarios);
  T("#t-qf", [{k: "src", l: "Source", f: LG.ip}, {k: "dst", l: "Destination", f: LG.ip}, {k: "direction", l: "Dir"}, {k: "n", l: "Hits", num: true}], r.qfeeds_hits);
  T("#t-talkers", [{k: "ip", l: "Host", f: LG.ip}, {k: "peers", l: "Peers", num: true}, {k: "n", l: "Events", num: true}], r.top_talkers_internal);
  T("#t-devices", [{k: "mac", l: "MAC", f: LG.mac}, {k: "ip", l: "IP", f: LG.ip}, {k: "hostname", l: "Name"}, {k: "first_seen", l: "First seen", f: LG.ago}], r.new_devices, "No new devices", { k: "first_seen", dir: -1 });

  renderMore(d);

  // system card
  const s = d.system || {}, gws = d.gateways || [];
  const info = s.information || {}, mem = (s.resources || {}).memory || {}, st = s.pf_states || {}, tm = s.time || {};
  const memPct = mem.total ? Math.round(mem.used / mem.total * 100) : null;
  const statePct = st.limit ? Math.round(st.current / st.limit * 100) : null;
  const bar = p => p === null ? "" : `<div class="bar ${p > 90 ? "bad" : p > 75 ? "warn" : ""}"><i style="width:${p}%"></i></div>`;
  if (!$("sys")) return;
  $("sys").innerHTML = s.resources ? `
    <div class="kv">
      <div>Host</div><div>${LG.esc(info.name || "")}</div>
      <div>Version</div><div>${LG.esc((info.versions || []).join(" · "))}</div>
      <div>Uptime</div><div>${LG.esc(tm.uptime || "")}</div>
      <div>Load</div><div>${LG.esc(tm.loadavg || "")}</div>
      <div>Memory</div><div>${memPct ?? "?"}% of ${LG.bytes(mem.total)}${bar(memPct)}</div>
      <div>States</div><div>${LG.num(st.current)} / ${LG.num(st.limit)}${bar(statePct)}</div>
      <div>Gateways</div><div>${gws.map(g => `<span class="dot ${/online|none/i.test(g.status_translated || g.status) ? "ok" : "bad"}"></span>${LG.esc(g.name)} ${LG.esc(g.delay || "")}`).join("<br>") || "–"}</div>
    </div>` : `<div class="empty">No OPNsense API data yet. Enter the OPNsense URL and API key under <a href="/settings#opnsense">Settings › OPNsense</a>.</div>`;
}
/* ---- the optional Threats / UniFi / Unraid / Backups widgets ---- */
const badge = (cls, txt) => `<span class="badge ${cls}">${LG.esc(txt)}</span>`;
const JOB_STATE = { failed: ["bad", "failed"], overdue: ["warn", "overdue"], warning: ["warn", "warnings"], running: ["info", "running"],
                    never: ["", "never run"], ok: ["ok", "ok"] };
const pct = v => v === null || v === undefined ? "–" : `${Math.round(v)}%`;
function renderMore(d) {
  const r = d.report, k = d.kpi, on = d.sources || {}, th = d.threats || {}, now = d.now || {};
  if ($("c-threat-blocks")) {
    const rows = [["Suricata dropped", k.ids_dropped, on.suricata, "#a855f7"], ["CrowdSec firewall blocks", k.crowdsec_fw, on.crowdsec, "#f97316"],
                  ["Q-Feeds hits", k.qfeeds, on.qfeeds, "#ef4444"]].filter(x => x[2] !== false);
    LG.chart("c-threat-blocks", { type: "bar", data: { labels: rows.map(x => x[0]),
      datasets: [{ data: rows.map(x => x[1] || 0), backgroundColor: rows.map(x => x[3]) }] },
      options: { indexAxis: "y", maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } },
                 scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } } });
  }
  T("#t-cs-ips", [{k: "ip", l: "Address", f: LG.ip}, {k: "country", l: "", f: LG.flag}, {k: "last", l: "Last", f: LG.ago}, {k: "n", l: "Blocks", num: true}],
    th.crowdsec_ips || [], "No CrowdSec firewall blocks logged (Services › CrowdSec › Settings › Enable log for rules)");
  T("#t-ids-drop", [{k: "signature", l: "Signature"}, {k: "sources", l: "Srcs", num: true}, {k: "n", l: "Dropped", num: true}],
    th.ids_dropped || [], "Suricata dropped nothing (IPS mode off, or no drop rules)");
  T("#t-sec-clients", [{k: "name", l: "Device"}, {k: "ip", l: "IP", f: LG.ip}, {k: "conn_where", l: "Connected to"},
    {k: "fw", l: "FW blocks", num: true}, {k: "dns", l: "DNS blocked", num: true}, {k: "threats", l: "Threats", num: true}],
    r.clients_with_security_events || [], "No known device had security events", { k: "threats", dir: -1 });
  // UniFi
  T("#t-unifi-now", [{k: "name", l: "Device", f: (v, x) => `${LG.esc(v)}<div class="small muted">${LG.esc(x.model || "")}</div>`},
    {k: "state", l: "State", s: x => /^(connected|online)$/.test(x.state) ? 1 : 0,
     f: v => badge(/^(connected|online)$/.test(v || "") ? "ok" : /pending|upgrad|provision|adopt/.test(v || "") ? "info" : "bad", v || "?")},
    {k: "clients", l: "Clients", num: true}, {k: "version", l: "Firmware", f: (v, x) => `${LG.esc(v || "")}${x.upgradable ? ` ${badge("warn", "update")}` : ""}`}],
    [...(now.unifi_devices || [])].sort((a, b) => (/^(connected|online)$/.test(a.state) - /^(connected|online)$/.test(b.state)) ||
      String(a.name).localeCompare(String(b.name))), "No UniFi devices (Settings › UniFi)", { k: "state", dir: 1 });
  T("#t-unifi-dev", [{k: "device", l: "Device"}, {k: "offline", l: "Offline", num: true}, {k: "restarts", l: "Restarts", num: true},
    {k: "poe", l: "PoE drops", num: true}], r.unifi_devices || [], "No access point / switch went offline", { k: "offline", dir: -1 });
  T("#t-unifi-clients", [{k: "client", l: "Client"}, {k: "disconnects", l: "Disconnects", num: true}, {k: "roams", l: "Roams", num: true}],
    r.unifi_clients || [], "No client events", { k: "disconnects", dir: -1 });
  // Unraid
  T("#t-unraid-storage", [{k: "server", l: "Server"}, {k: "grp", l: "Array / pool"},
    {k: "state", l: "State", f: v => v ? badge(/started/i.test(v) ? "ok" : "warn", v.toLowerCase()) : ""},
    {k: "used_pct", l: "Used", num: true, f: v => v === null ? "–" : `${pct(v)}<div class="bar ${v > 90 ? "bad" : v > 80 ? "warn" : ""}"><i style="width:${Math.min(100, v)}%"></i></div>`},
    {k: "free", l: "Free", num: true, f: v => v === null ? "–" : LG.bytes(v)}, {k: "disks", l: "Disks", num: true},
    {k: "errors", l: "Errors", num: true, f: v => v ? `<span class="state-EXITED">${LG.num(v)}</span>` : "0"},
    {k: "max_temp", l: "Max °C", num: true, f: v => v === null ? "–" : `${Math.round(v)}°`}], r.unraid_storage || [], "No storage data yet", null);
  T("#t-unraid-res", [{k: "server", l: "Server"}, {k: "cpu_avg", l: "CPU avg", num: true, f: pct}, {k: "cpu_max", l: "max", num: true, f: pct},
    {k: "mem_avg", l: "Mem avg", num: true, f: pct}, {k: "mem_max", l: "max", num: true, f: pct}], r.unraid_resources || [], "No CPU / memory data in this period");
  if ($("unraid-ctr")) {
    const srv = now.unraid || [];
    $("unraid-ctr").innerHTML = !srv.length ? `<div class="empty">No Unraid server (Settings › Unraid servers)</div>` : srv.map(x =>
      `<div class="kv"><div><b>${LG.esc(x.server)}</b></div><div>${!x.known ? `<span class="muted">no container data yet</span>` :
        `${x.running} of ${x.total} running` + (x.problems.length ? "" : ` ${badge("ok", "all fine")}`)}</div></div>` +
      x.problems.map(c => `<div class="small" style="margin:3px 0 3px 10px">${badge(c.health === "unhealthy" ? "bad" : c.autostart ? "bad" : "", c.health === "unhealthy" ? "unhealthy" : c.state)} ` +
        `${LG.esc(c.name)}${c.autostart && c.state !== "running" ? ` <span class="muted">(autostart on)</span>` : ""}</div>`).join("")).join("");
  }
  T("#t-unraid-notif", [{k: "server", l: "Server"}, {k: "importance", l: "Level", s: x => ["ALERT", "WARNING", "NORMAL", "INFO"].indexOf(x.importance),
    f: v => badge(v === "ALERT" ? "bad" : v === "WARNING" ? "warn" : "", (v || "").toLowerCase())}, {k: "subject", l: "Notification"},
    {k: "n", l: "#", num: true}, {k: "last", l: "Last", f: LG.ago}], r.unraid_notifications || [], "No notifications in this period", { k: "importance", dir: 1 });
  T("#t-unraid-logs", [{k: "server", l: "Server"}, {k: "container", l: "Container"}, {k: "errors", l: "Errors", num: true},
    {k: "warnings", l: "Warnings", num: true}], r.unraid_container_logs || [], "No errors in container logs", { k: "errors", dir: -1 });
  // Backups
  T("#t-backup-jobs", [{k: "state", l: "State", s: x => ["failed", "overdue", "warning", "running", "never", "ok"].indexOf(x.state),
      f: v => { const [c, t] = JOB_STATE[v] || ["", v]; return badge(c, t); }},
    {k: "job", l: "Job", f: (v, x) => `<b>${LG.esc(v)}</b> ${LG.src(x.source_label)}` +
      (["failed", "warning"].includes(x.state) && x.last_message ? `<div class="small muted">${LG.esc(x.last_message.slice(0, 140))}</div>` : "")},
    {k: "last_good", l: "Last successful", f: v => v ? LG.ago(v) : `<span class="muted">never</span>`},
    {k: "ok", l: "Runs", num: true, s: x => (x.ok || 0) + (x.warned || 0) + (x.failed || 0), f: (v, x) => `<span class="state-RUNNING">${x.ok || 0}</span>` +
      (x.warned ? ` · <span class="state-PAUSED">${x.warned} warn</span>` : "") + (x.failed ? ` · <span class="state-EXITED">${x.failed} failed</span>` : "")}],
    now.backup_jobs || [], "No backup jobs (Settings › Backrest / Bichon)", { k: "state", dir: 1 });
}
(async () => {
  try { layout = cleanLayout((await LG.api("/api/layout/overview")).layout) ; } catch (e) { layout = []; }
  if (!layout.length) layout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
  build();
  load();
})();
const auto = LG.autoRefresh(() => { if (!editing) load(); }, () => LG.refreshMs(hours));
</script>
{% endblock %}
