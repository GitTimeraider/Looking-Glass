{% extends "base.html" %}
{% block body %}
<header class="top">
  <h1 id="title">{{ title }}</h1>
  <span class="muted small" id="updated"></span>
  <div class="seg" id="range">
    <button data-v="1">1h</button><button data-v="6">6h</button><button data-v="24">24h</button><button data-v="168">7d</button><button data-v="720">30d</button>
  </div>
</header>
<div class="tabs" id="dtabs" hidden></div>
<div class="grid g3" id="panels" style="grid-auto-flow: row dense"></div>
{% endblock %}
{% block scripts %}
<script>
const NAME = "{{ name }}";
let hours = Number(localStorage.getItem("lg-hours-" + NAME) || 24);
LG.seg(document.getElementById("range"), hours, v => { hours = Number(v); localStorage.setItem("lg-hours-" + NAME, v); auto.touch(); load(); });

const FMT = {
  ip: LG.ip, flag: LG.flag, ago: LG.ago, time: LG.time, sev: LG.sev, src: LG.src, bytes: LG.bytes,
  num: LG.num,
};
let built = false, step = 3600;
// dashboards with tabs (Threats): the tab is in the address (#suricata), only its panels are loaded
let tab = decodeURIComponent(location.hash.slice(1)), builtTab = null;
function drawTabs(d) {
  const el = document.getElementById("dtabs");
  el.hidden = !(d.tabs && d.tabs.length);
  if (el.hidden) return;
  el.innerHTML = d.tabs.map(t => `<button type="button" data-t="${LG.esc(t.id)}" class="${t.id === d.tab ? "on" : ""}">${LG.esc(t.title)}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.t === tab && built) return;
    tab = b.dataset.t;
    history.replaceState(null, "", "#" + tab);
    el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    document.getElementById("panels").innerHTML = `<div class="card span3 muted">Loading…</div>`;
    built = false;
    load();
  });
}
window.addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if (h && h !== tab) { tab = h; built = false; load(); } });

/* ---- click-through: every chart element, table row and tile opens Event search with matching filters ----
   panel.drill = {base: {...}, by: "param" | {param: column}, series: "param", tiles: {"Tile": {...} | null}, url}
   Row columns named f_<param> are used as filters directly (null -> "none" = empty value). */
function drillBase(p, d) {
  if (p.drill === false) return null;
  const dr = p.drill || {};
  const params = { hours, ...(dr.base || {}) };
  if (!("source" in params) && d.source) params.source = d.source;
  return params;
}
function rowFilters(p, r) {
  const out = {}, by = (p.drill || {}).by;
  for (const [k, v] of Object.entries(r)) {
    if (k.startsWith("f_")) out[k.slice(2)] = v === null || v === undefined ? "none" : v;          // f_: always (null = empty)
    else if (k.startsWith("o_") && v !== null && v !== undefined && v !== "") out[k.slice(2)] = v;  // o_: only when set
  }
  if (typeof by === "string" && !(by in out) && "label" in r) out[by] = r.label === null || r.label === "?" ? "none" : r.label;
  else if (by && typeof by === "object")
    for (const [param, col] of Object.entries(by)) if (!(param in out) && r[col] !== null && r[col] !== undefined && r[col] !== "") out[param] = r[col];
  return out;
}
function go(p, params, url) {
  url = url || (p.drill || {}).url;
  const { url: _ignored, ...rest } = params;
  location.href = url ? url : LG.drillUrl(rest);
}

function build(d) {
  const box = document.getElementById("panels");
  // why a tab is empty (Threats › Suricata), filled in by render()
  box.innerHTML = `<div class="card span3" id="dnotice" hidden></div>` + d.panels.map(p => {
    // a table with 5+ columns gets at least two thirds of the width, so its count columns are not cut off
    const wide = p.type === "table" && (p.cols || []).length >= 5;
    const span = p.span === 3 || p.type === "stat" || p.type === "log" ? "span3" : p.span === 2 || wide ? "span2" : "";
    const body = p.type === "stat" ? `<div class="grid kpis" id="p-${p.id}"></div>`
      : ["timeseries", "bar", "hbar", "pie"].includes(p.type) ? `<div class="chart-box${p.type === "hbar" ? " tall" : ""}"><canvas id="c-${p.id}"></canvas></div>`
      : `<div id="p-${p.id}"></div>`;
    return p.type === "stat" ? `<div class="${span}">${body}</div>` : `<div class="card ${span}"><h3>${LG.esc(p.title || "")}${SORTABLE_CHARTS.includes(p.type) ? `<span data-sort-slot="${p.id}"></span>` : ""}<span class="sp"></span>${p.type === "log" ? `<a class="small" href="/events?source=${encodeURIComponent(d.source || "")}&hours=${hours}">search all →</a>` : ""}</h3>${body}</div>`;
  }).join("");
  box.querySelectorAll("[data-sort-slot]").forEach(slot => {
    const id = slot.dataset.sortSlot, t = LG.sortToggle(`${NAME}:${id}`, () => { if (lastData) render(lastData, id); });
    chartSort[id] = t.mode; slot.replaceWith(t.el);
  });
  built = true;
}

const SORTABLE_CHARTS = ["hbar", "pie"], chartSort = {};
let lastData = null;
// table columns: label for the unlabelled country column, newest / biggest first for times and sizes
const tableCols = p => (p.cols || Object.keys((p.rows || [])[0] || {}).filter(k => !/^[fo]_/.test(k)).map(k => [k, k]))
  .map(([k, l, f]) => ({ k, l: l || (f === "flag" ? "Country" : ""), num: f === "num", desc: ["time", "ago", "bytes"].includes(f),
                         f: f && f !== "num" ? FMT[f] : undefined }));

function render(d, only) {
  step = d.step || step;
  lastData = d;
  const note = document.getElementById("dnotice");
  if (note) { note.hidden = !d.notice; note.innerHTML = d.notice ? `<b>Why is this empty?</b> <span class="small">${LG.esc(d.notice)}</span>` : ""; }
  for (const p of d.panels) {
    if (only && p.id !== only) continue;
    const base = drillBase(p, d);
    if (p.error) { const el = document.getElementById("p-" + p.id) || document.getElementById("c-" + p.id)?.parentElement; if (el) el.innerHTML = `<div class="empty">query failed: ${LG.esc(p.error)}</div>`; continue; }
    const rows = p.rows || [];
    if (p.type === "stat") {
      const r = rows[0] || {}, tiles = (p.drill || {}).tiles || {};
      const el = document.getElementById("p-" + p.id);
      el.innerHTML = Object.entries(r).map(([k, v]) => `<div class="card kpi${base && tiles[k] !== null ? " clickable" : ""}" data-k="${LG.esc(k)}" title="${base && tiles[k] !== null ? "Show these events" : ""}"><div class="v">${LG.num(v)}</div><div class="l">${LG.esc(k)}</div></div>`).join("");
      if (base) el.querySelectorAll(".kpi.clickable").forEach(t => t.onclick = () => go(p, { ...base, ...(tiles[t.dataset.k] || {}) }, (tiles[t.dataset.k] || {}).url));
    } else if (p.type === "timeseries") {
      const ser = (p.drill || {}).series;
      LG.seriesChart("c-" + p.id, rows, { hours, onClick: base && ((t, s) => {
        const t0 = new Date(t);
        // series_drill: a series that is not simply a value of the column (CrowdSec includes its firewall blocks)
        const sd = ((p.drill || {}).series_drill || {})[s];
        go(p, { ...base, hours: undefined, start: t0.toISOString(), end: new Date(t0.getTime() + step * 1000).toISOString(),
                ...(sd ? sd : ser ? { [ser]: s === null || s === "?" ? "none" : s } : {}) });
      }) });
    } else if (p.type === "pie") {
      const sorted = LG.sortRows(rows, chartSort[p.id] && chartSort[p.id]());
      LG.pieChart("c-" + p.id, sorted, base && (r => go(p, { ...base, ...rowFilters(p, r) })));
    } else if (p.type === "bar" || p.type === "hbar") {
      const sorted = p.type === "hbar" ? LG.sortRows(rows, chartSort[p.id] && chartSort[p.id]()) : rows;
      LG.barChart("c-" + p.id, sorted, p.type === "hbar", base && (r => go(p, { ...base, ...rowFilters(p, r) })));
    } else if (p.type === "table") {
      LG.table("#p-" + p.id, tableCols(p), rows, "No data", base && (r => go(p, { ...base, ...rowFilters(p, r) })),
               { sortAll: true, order: p.order });
    } else if (p.type === "log") {
      LG.table("#p-" + p.id, [{k: "ts", l: "Time", f: LG.time}, {k: "source", l: "Src", f: LG.src}, {k: "action", l: "Action"},
        {k: "src_ip", l: "From", f: (v, r) => `${LG.ip(v)}${r.src_port ? `<span class="muted">:${r.src_port}</span>` : ""} ${LG.flag(r.src_country)}`},
        {k: "dst_ip", l: "To", f: (v, r) => `${LG.ip(v)}${r.dst_port ? `<span class="muted">:${r.dst_port}</span>` : ""}`},
        {k: "message", l: "Message", f: (v, r) => `<span class="mono small msgtxt">${LG.esc(r.domain && !String(v).includes(r.domain) ? r.domain + " · " : "")}${LG.esc(v)}</span>`}], rows, "No events in this period",
        r => go(p, { hours, source: r.source, ...(r.src_ip ? { ip: r.src_ip } : r.domain ? { domain: r.domain } : { q: (r.message || "").slice(0, 60) }) }));
    }
  }
}

async function load() {
  try {
    const d = await LG.api(`/api/dash/${NAME}?hours=${hours}${tab ? `&tab=${encodeURIComponent(tab)}` : ""}`,
                           { signal: LG.latest("dash") });
    const view = { kind: "dash", name: NAME, tab: tab || null, hours };
    // 7 / 30 days never counted yet: counted in the background; what is shown belongs to another period
    document.getElementById("panels").classList.toggle("pending-period", !!d.pending);
    if (d.pending) {
      if (!built) document.getElementById("panels").innerHTML = `<div class="card span3 muted">Counting this period for the first time…</div>`;
      LG.updated(document.getElementById("updated"), d, load, view);
      return;
    }
    if (d.tab && tab && d.tab !== tab) { tab = d.tab; history.replaceState(null, "", "#" + tab); }  // that tab's source is off
    drawTabs(d);
    if (!built || d.tab !== builtTab) { build(d); builtTab = d.tab; }
    render(d);
    LG.updated(document.getElementById("updated"), d, load, view);
  } catch (e) {
    if (LG.aborted(e)) return;  // another period / tab was picked meanwhile
    document.getElementById("panels").innerHTML = `<div class="card">Failed to load: ${LG.esc(e.message)}</div>`; built = false; }
}
load();
const auto = LG.autoRefresh(load, () => LG.refreshMs(hours));
</script>
{% endblock %}
