{% extends "base.html" %}
{% block body %}
<header class="top"><h1>Reports</h1></header>
<div class="card filters">
  <b>New report:</b>
  <select id="hours"><option value="24">Last 24 hours</option><option value="168">Last 7 days</option><option value="720">Last 30 days</option></select>
  <span class="muted">covering</span>
  <span id="cats" class="multi-choice"></span>
  <a href="#" id="cats-all" class="small" title="Tick everything: the full report">all</a>
  <label {% if not ai_enabled %}title="Set up the AI analyst under Settings to enable" class="muted"{% endif %}><input type="checkbox" id="ai" {% if ai_enabled %}checked{% else %}disabled{% endif %}> include AI analysis</label>
  <button id="go">Generate</button>
  <span id="state" class="muted small"></span>
</div>
<div class="card"><div id="list"></div></div>
{% endblock %}
{% block scripts %}
<script>
let CATS = [];  // [{key, name, configured}]
const coversText = keys => keys.length >= CATS.length ? "All" : keys.map(k => (CATS.find(c => c.key === k) || {name: k}).name).join(", ");
async function loadCats() {
  CATS = (await LG.api("/api/reports/categories")).categories;
  // all ticked = the full report (the default); not set up: still selectable (older data), shown greyed out
  document.getElementById("cats").innerHTML = CATS.map(c => `<label class="${c.configured ? "" : "unset"}" ${c.configured ? "" : `title="${LG.esc(c.name)} is not set up (Settings) - the report part may be empty"`}>
    <input type="checkbox" value="${c.key}" checked> ${LG.esc(c.name)}</label>`).join("");
}
const selectedCats = () => [...document.querySelectorAll("#cats input:checked")].map(x => x.value);
document.getElementById("cats-all").onclick = e => { e.preventDefault(); document.querySelectorAll("#cats input").forEach(x => x.checked = true); };
async function load() {
  const rows = await LG.api("/api/reports");
  LG.table("#list", [{k: "id", l: "#"}, {k: "title", l: "Report", f: (v, r) => `<a href="/reports/${r.id}">${LG.esc(v)}</a>`},
    {k: "categories", l: "Covers", f: v => LG.esc(coversText(v || []))},
    {k: "created_at", l: "Created", f: LG.time}, {k: "period_h", l: "Period (h)", num: true}, {k: "has_ai", l: "AI", f: (v, r) => r.ai_state === "running" ? `<span class="spinner" title="AI analysis running"></span>` : r.ai_state === "failed" ? `<span class="err" title="AI analysis failed - open the report to retry">failed</span>` : v ? "✔" : ""},
    {k: "id", l: "", f: v => `<a href="/api/reports/${v}/download">json</a> · <a href="#" data-del="${v}">delete</a>`}], rows, "No reports yet");
  document.querySelectorAll("[data-del]").forEach(a => a.onclick = async e => { e.preventDefault(); if (confirm("Delete report?")) { await LG.api(`/api/reports/${a.dataset.del}`, { method: "DELETE" }); load(); } });
}
document.getElementById("go").onclick = async () => {
  const b = document.getElementById("go"), st = document.getElementById("state"), categories = selectedCats();
  if (!categories.length) { st.textContent = "Tick at least one part to cover."; return; }
  b.disabled = true; st.innerHTML = `<span class="spinner"></span> generating${document.getElementById("ai").checked ? " (AI analysis can take a few minutes)" : ""}…`;
  try {
    const r = await LG.api("/api/reports", { method: "POST", body: { hours: Number(document.getElementById("hours").value), categories, ai: document.getElementById("ai").checked } });
    location.href = `/reports/${r.id}`;
  } catch (e) { st.textContent = e.message; } finally { b.disabled = false; }
};
loadCats().catch(e => document.getElementById("state").textContent = e.message).then(load);
</script>
{% endblock %}
