{% extends "base.html" %}
{% block body %}
<header class="top">
  <h1>OPNsense system</h1>
  <div class="seg" id="range"><button data-v="6">6h</button><button data-v="24">24h</button><button data-v="168">7d</button></div>
</header>
<div class="grid g3">
  <div class="card"><h3>System</h3><div id="sys"></div></div>
  <div class="card"><h3>Firmware</h3><div id="fw"></div></div>
  <div class="card"><h3>Disks &amp; temperature</h3><div id="disk"></div></div>
</div>
<div class="grid g3" style="margin-top:14px">
  <div class="card"><h3>Memory %</h3><div class="chart-box sm"><canvas id="c-mem"></canvas></div></div>
  <div class="card"><h3>Load (1m)</h3><div class="chart-box sm"><canvas id="c-load"></canvas></div></div>
  <div class="card"><h3>Firewall states</h3><div class="chart-box sm"><canvas id="c-states"></canvas></div></div>
  <div class="card" style="grid-column: span 2"><h3>Interface throughput (rx+ / tx−)</h3><div class="chart-box"><canvas id="c-if"></canvas></div></div>
  <div class="card"><h3>Gateway latency (ms)</h3><div class="chart-box"><canvas id="c-gw"></canvas></div></div>
</div>
<div class="grid g2" style="margin-top:14px">
  <div class="card"><h3>Gateways</h3><div id="gws"></div></div>
  <div class="card"><h3>Interfaces</h3><div id="ifs"></div></div>
  <div class="card"><h3>Services</h3><div id="svcs"></div></div>
  <div class="card"><h3>Devices (ARP / DHCP)</h3><div id="devs"></div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let hours = 24;
LG.seg(document.getElementById("range"), hours, v => { hours = Number(v); charts(); });
function line(id, series, opts = {}) {
  const datasets = Object.entries(series).map(([label, pts], i) => ({ label: label || id, data: pts.map(p => ({ x: new Date(p[0]).getTime(), y: opts.neg && opts.neg(label) ? -p[1] : p[1] })),
    borderColor: LG.palette[i % LG.palette.length], backgroundColor: LG.palette[i % LG.palette.length], pointRadius: 0, borderWidth: 1.5, tension: .2 }));
  LG.chart(id, { type: "line", data: { datasets }, options: { maintainAspectRatio: false, animation: false, parsing: false,
    scales: { x: { type: "linear", ticks: { callback: v => new Date(v).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), maxTicksLimit: 8 } },
              y: { ticks: { callback: opts.fmt || (v => v) } } },
    plugins: { legend: { display: datasets.length > 1, position: "bottom", labels: { boxWidth: 10 } },
               tooltip: { callbacks: { label: c => `${c.dataset.label}: ${(opts.fmt || (v => v))(Math.abs(c.parsed.y))}` } } } } });
}
async function charts() {
  const m = n => LG.api(`/api/metrics?name=${n}&hours=${hours}`);
  const [mem, load, st, rx, tx, gw] = await Promise.all([m("memory_used_pct"), m("load1"), m("pf_states"), m("if_rx_bps"), m("if_tx_bps"), m("gateway_delay_ms")]);
  line("c-mem", mem); line("c-load", load); line("c-states", st); line("c-gw", gw);
  const ifs = {};
  for (const [k, v] of Object.entries(rx)) ifs[k + " rx"] = v;
  for (const [k, v] of Object.entries(tx)) ifs[k + " tx"] = v;
  line("c-if", ifs, { fmt: v => LG.bps(Math.abs(v)), neg: l => l.endsWith(" tx") });
}
async function load() {
  const d = await LG.api("/api/system");
  const S = k => (d.snapshots[k] || {}).data;
  const s = S("system") || {};
  const info = s.information || {}, tm = s.time || {}, mem = (s.resources || {}).memory || {}, st = s.pf_states || {};
  document.getElementById("sys").innerHTML = d.opnsense ? `<div class="kv">
    <div>Host</div><div>${LG.esc(info.name)}</div><div>Versions</div><div>${LG.esc((info.versions || []).join(" · "))}</div>
    <div>CPU</div><div>${LG.esc((info.cpu_type || ""))}</div><div>Uptime</div><div>${LG.esc(tm.uptime)}</div>
    <div>Time</div><div>${LG.esc(tm.datetime)}</div><div>Load</div><div>${LG.esc(tm.loadavg)}</div>
    <div>Memory</div><div>${LG.bytes(mem.used)} / ${LG.bytes(mem.total)}</div>
    <div>States</div><div>${LG.num(st.current)} / ${LG.num(st.limit)}</div></div>` : `<div class="empty">OPNsense API not configured.</div>`;
  const fw = S("firmware") || {};
  document.getElementById("fw").innerHTML = fw.product ? `<div class="kv">
    <div>Product</div><div>${LG.esc((fw.product || {}).product_name)} ${LG.esc((fw.product || {}).product_version)}</div>
    <div>Status</div><div>${LG.esc(fw.status_msg || fw.status)}</div>
    <div>Updates</div><div>${LG.esc(fw.updates ?? (fw.all_packages ? Object.keys(fw.all_packages).length : "–"))}</div>
    <div>Last check</div><div>${LG.esc(fw.last_check || "")}</div></div>` : `<div class="kv"><div>Status</div><div>${LG.esc(fw.status_msg || fw.status || "unknown")}</div></div>`;
  const disks = (s.disk || {}).devices || [], temps = Array.isArray(s.temperature) ? s.temperature : [];
  document.getElementById("disk").innerHTML = disks.map(x => `<div class="small">${LG.esc(x.mountpoint)} (${LG.esc(x.type)}) ${LG.esc(x.used)} / ${LG.esc(x.blocks)} — ${LG.esc(x.used_pct)}%<div class="bar ${x.used_pct > 90 ? "bad" : x.used_pct > 75 ? "warn" : ""}"><i style="width:${Number(x.used_pct) || 0}%"></i></div></div>`).join("")
    + temps.map(t => `<div class="small">${LG.esc(t.type_translated || t.device)}: ${LG.esc(t.temperature)} °C</div>`).join("") || `<div class="empty">–</div>`;
  LG.table("#gws", [{k: "name", l: "Name"}, {k: "address", l: "Address"}, {k: "status_translated", l: "Status", f: (v, r) => `<span class="dot ${/online|none/i.test(v || r.status) ? "ok" : "bad"}"></span>${LG.esc(v || r.status)}`},
    {k: "delay", l: "RTT"}, {k: "stddev", l: "RTTd"}, {k: "loss", l: "Loss"}], S("gateways") || []);
  const ifsnap = S("interfaces") || {};
  const seen = new Set(), ifrows = [];
  for (const [k, v] of Object.entries(ifsnap)) {
    if (!v || typeof v !== "object" || v["received-bytes"] === undefined || seen.has(v.name)) continue;
    seen.add(v.name); ifrows.push({ name: k, rx: v["received-bytes"], tx: v["sent-bytes"], ierr: v["received-errors"], oerr: v["send-errors"], drop: v["dropped-packets"] });
  }
  LG.table("#ifs", [{k: "name", l: "Interface"}, {k: "rx", l: "RX", f: LG.bytes}, {k: "tx", l: "TX", f: LG.bytes}, {k: "ierr", l: "In err", num: true}, {k: "oerr", l: "Out err", num: true}, {k: "drop", l: "Drops", num: true}], ifrows);
  LG.table("#svcs", [{k: "name", l: "Service"}, {k: "description", l: "Description"}, {k: "running", l: "State", f: v => `<span class="dot ${String(v) === "1" ? "ok" : "bad"}"></span>${String(v) === "1" ? "running" : "stopped"}`}], S("services") || []);
  const devs = await LG.api("/api/devices");
  LG.table("#devs", [{k: "mac", l: "MAC", f: v => `<span class="mono">${LG.esc(v)}</span>`}, {k: "ip", l: "IP", f: LG.ip}, {k: "hostname", l: "Hostname"}, {k: "first_seen", l: "First seen", f: LG.time}, {k: "last_seen", l: "Last", f: LG.ago}], devs);
}
load(); charts();
setInterval(() => { load(); charts(); }, 60000);
</script>
{% endblock %}
