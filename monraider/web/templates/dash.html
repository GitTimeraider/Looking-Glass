{% extends "base.html" %}
{% block body %}
<header class="top">
  <h1 id="title">{{ title }}</h1>
  <span class="muted small" id="updated"></span>
  <div class="seg" id="range">
    <button data-v="1">1h</button><button data-v="6">6h</button><button data-v="24">24h</button><button data-v="168">7d</button><button data-v="720">30d</button>
  </div>
</header>
<div class="grid g3" id="panels"></div>
{% endblock %}
{% block scripts %}
<script>
const NAME = "{{ name }}";
let hours = Number(localStorage.getItem("mr-hours-" + NAME) || 24);
MR.seg(document.getElementById("range"), hours, v => { hours = Number(v); localStorage.setItem("mr-hours-" + NAME, v); load(); });

const FMT = {
  ip: MR.ip, flag: MR.flag, ago: MR.ago, time: MR.time, sev: MR.sev, src: MR.src, bytes: MR.bytes,
  num: MR.num,
};
let built = false;

function build(d) {
  const box = document.getElementById("panels");
  box.innerHTML = d.panels.map(p => {
    const span = p.span === 3 || p.type === "stat" || p.type === "log" ? "span3" : p.span === 2 ? "span2" : "";
    const body = p.type === "stat" ? `<div class="grid kpis" id="p-${p.id}"></div>`
      : ["timeseries", "bar", "hbar", "pie"].includes(p.type) ? `<div class="chart-box${p.type === "hbar" ? " tall" : ""}"><canvas id="c-${p.id}"></canvas></div>`
      : `<div id="p-${p.id}"></div>`;
    return p.type === "stat" ? `<div class="${span}">${body}</div>` : `<div class="card ${span}"><h3>${MR.esc(p.title || "")}<span class="sp"></span>${p.type === "log" ? `<a class="small" href="/events?source=${encodeURIComponent(d.source || "")}">search all →</a>` : ""}</h3>${body}</div>`;
  }).join("");
  built = true;
}

function render(d) {
  for (const p of d.panels) {
    if (p.error) { const el = document.getElementById("p-" + p.id) || document.getElementById("c-" + p.id)?.parentElement; if (el) el.innerHTML = `<div class="empty">query failed: ${MR.esc(p.error)}</div>`; continue; }
    const rows = p.rows || [];
    if (p.type === "stat") {
      const r = rows[0] || {};
      document.getElementById("p-" + p.id).innerHTML = Object.entries(r).map(([k, v]) => `<div class="card kpi"><div class="v">${MR.num(v)}</div><div class="l">${MR.esc(k)}</div></div>`).join("");
    } else if (p.type === "timeseries") {
      MR.seriesChart("c-" + p.id, rows, { hours });
    } else if (p.type === "pie") {
      MR.pieChart("c-" + p.id, rows);
    } else if (p.type === "bar" || p.type === "hbar") {
      MR.barChart("c-" + p.id, rows, p.type === "hbar");
    } else if (p.type === "table") {
      MR.table("#p-" + p.id, (p.cols || Object.keys(rows[0] || {}).map(k => [k, k])).map(([k, l, f]) => ({ k, l, num: f === "num", f: f && f !== "num" ? FMT[f] : undefined })), rows);
    } else if (p.type === "log") {
      MR.table("#p-" + p.id, [{k: "ts", l: "Time", f: MR.time}, {k: "source", l: "Src", f: MR.src}, {k: "action", l: "Action"},
        {k: "src_ip", l: "From", f: (v, r) => `${MR.ip(v)}${r.src_port ? `<span class="muted">:${r.src_port}</span>` : ""} ${MR.flag(r.src_country)}`},
        {k: "dst_ip", l: "To", f: (v, r) => `${MR.ip(v)}${r.dst_port ? `<span class="muted">:${r.dst_port}</span>` : ""}`},
        {k: "message", l: "Message", f: (v, r) => `<span class="mono small msgtxt">${MR.esc(r.domain && !String(v).includes(r.domain) ? r.domain + " · " : "")}${MR.esc(v)}</span>`}], rows, "No events in this period");
    }
  }
}

async function load() {
  try {
    const d = await MR.api(`/api/dash/${NAME}?hours=${hours}`);
    if (!built) build(d);
    render(d);
    document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) { document.getElementById("panels").innerHTML = `<div class="card">Failed to load: ${MR.esc(e.message)}</div>`; built = false; }
}
load();
setInterval(load, 60000);
</script>
{% endblock %}
