# Run this ON THE UNRAID SERVER (optional). It exposes a READ-ONLY Docker API on port 2375 so MonRaider can
# graph per-container CPU / memory / network usage. Never publish the raw /var/run/docker.sock.
#
# Unraid without the compose plugin: Docker tab > Add Container, Repository: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0,
# add a Path /var/run/docker.sock -> /var/run/docker.sock (read only), a Port 2375 -> 2375 and the
# Variables CONTAINERS=1, INFO=1, VERSION=1, POST=0.
# Then in MonRaider: Integrations > your Unraid server > Docker API = http://<unraid-ip>:2375
#
# Restrict access: only MonRaider's host should reach port 2375 (firewall rule in OPNsense or bind to a specific IP).
services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1    # /containers/json, /containers/{id}/stats, /containers/{id}/logs
      INFO: 1
      VERSION: 1
      POST: 0          # read only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
