# Looking Glass with Docker secrets: no passwords in environment variables or in `docker inspect` at all.
#   mkdir -p secrets && openssl rand -hex 24 > secrets/db_password && chmod 600 secrets/db_password
#   docker compose -f docker-compose.secrets.yml up -d
# The database password is read from a file by both PostgreSQL and Looking Glass. All integration credentials
# (OPNsense, AI, Zenarmor, Unraid) are entered in the web UI and stored encrypted with the key in the data volume.
services:
  looking-glass:
    image: ghcr.io/gittimeraider/looking-glass:latest
    container_name: looking-glass
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    secrets: [db_password]
    environment:
      DATABASE_URL: postgresql://lookingglass@db:5432/lookingglass
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_USER: admin
    ports:
      - "8080:8080"
      - "514:5514/udp"
      - "514:5514/tcp"
      - "9200:9200"        # Zenarmor Elasticsearch-compatible stream receiver
    volumes:
      - ./data:/data       # holds lookingglass.key (encryption key) - back it up with the database

  db:
    image: postgres:18-alpine
    container_name: looking-glass-db
    restart: unless-stopped
    secrets: [db_password]
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  db_password:
    file: ./secrets/db_password

volumes:
  pgdata:
