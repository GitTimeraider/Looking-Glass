# Unattended install (no setup wizard): database connection and first login come from Docker secret files, so
# nothing has to be typed in the browser and no password appears in environment variables or `docker inspect`.
#   (the standard docker-compose.yml uses the setup wizard instead)
#   mkdir -p secrets data && openssl rand -hex 24 > secrets/db_password
#   chmod 700 secrets && chmod 644 secrets/db_password   # folder closed on the host; the file itself must be readable
#                                                        # by the non-root users inside both containers
#   sudo chown 10001:10001 data
#   openssl rand -base64 18 > secrets/admin_password && chmod 644 secrets/admin_password   # first login (user admin)
#   docker compose -f docker-compose.secrets.yml up -d
# The database password is read from a file by both PostgreSQL and Looking Glass. All integration credentials
# (OPNsense, AI, Zenarmor, Unraid) are entered in the web UI and stored encrypted with the key in the data volume.
services:
  looking-glass:
    image: ghcr.io/gittimeraider/looking-glass:latest
    container_name: looking-glass
    restart: unless-stopped
    user: "10001:10001"   # uid:gid to run as (change both numbers); must own the data folder
    cap_drop: [ALL]                   # needs no Linux capabilities
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    secrets: [db_password, admin_password]
    environment:
      DATABASE_URL: postgresql://lookingglass@db:5432/lookingglass   # no password here: it comes from the file below
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_USER: admin
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password                # only used while no account exists
    ports:
      - "8080:8080"
      - "514:5514/udp"
      - "514:5514/tcp"
      - "9200:9200"        # Zenarmor Elasticsearch-compatible stream receiver
    volumes:
      - ./data:/data       # holds lookingglass.key (encryption key) - back it up with the database

  db:
    image: postgres:18
    container_name: looking-glass-db
    restart: unless-stopped
    shm_size: 512mb                   # Docker's default /dev/shm is 64 MB; parallel queries need more
    user: postgres                    # start directly as the postgres user, so no capabilities are needed
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [db_password]
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  db_password:
    file: ./secrets/db_password
  admin_password:
    file: ./secrets/admin_password

volumes:
  pgdata:
