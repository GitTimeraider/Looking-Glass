# Everything in one file with inline settings (no .env) - handy for Portainer stacks / Dockge.
# Replace every CHANGE-ME value before deploying.
services:
  looking-glass:
    image: ghcr.io/gittimeraider/looking-glass:latest
    container_name: looking-glass
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lookingglass:CHANGE-ME-db-password@db:5432/lookingglass
      ADMIN_USER: admin
      ADMIN_PASSWORD: CHANGE-ME-initial-password      # only used to create the first account
      TIMEZONE: Europe/Amsterdam
      OPNSENSE_URL: https://192.168.1.1
      OPNSENSE_API_KEY: CHANGE-ME
      OPNSENSE_API_SECRET: CHANGE-ME
      OPNSENSE_VERIFY_SSL: "false"
      SYSLOG_ALLOWED_SENDERS: 192.168.1.1              # IP of your OPNsense
      AI_BASE_URL: https://api.anthropic.com/v1/
      AI_MODEL: claude-opus-5-5
      AI_API_KEY: CHANGE-ME                            # leave empty to disable the AI analyst
      # optional: first Unraid server (more can be added in the UI under Integrations)
      UNRAID_NAME: Tower
      UNRAID_URL: http://192.168.1.10
      UNRAID_API_KEY: ""
      RETENTION_DAYS: "30"
    ports:
      - "8080:8080"
      - "514:5514/udp"
      - "514:5514/tcp"
      - "9200:9200"        # Zenarmor Elasticsearch-compatible stream receiver
    volumes:
      - lookingglass_data:/data

  db:
    image: postgres:18-alpine
    container_name: looking-glass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD: CHANGE-ME-db-password
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ layout (data lives in /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  lookingglass_data:
