# Everything in one file (no .env) - handy for Portainer stacks / Dockge.
# Replace every CHANGE-ME value before deploying.
services:
  looking-glass:
    image: ghcr.io/gittimeraider/looking-glass:latest
    container_name: looking-glass
    restart: unless-stopped
    user: "10001:10001"   # uid:gid to run as (change both numbers); must own the data folder
    cap_drop: [ALL]                   # needs no Linux capabilities
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lookingglass:CHANGE-ME-db-password@db:5432/lookingglass
      ADMIN_USER: admin                                # first account; password is printed in the log
      # Everything else (OPNsense API, AI key, Zenarmor, Unraid, retention ...) is configured in the web UI
      # under Settings and stored encrypted - do not put API keys in this file.
    ports:
      - "8080:8080"
      - "514:5514/udp"
      - "514:5514/tcp"
      - "9200:9200"        # Zenarmor Elasticsearch-compatible stream receiver
    volumes:
      - lookingglass_data:/data

  db:
    image: postgres:18-alpine
    container_name: looking-glass-db
    restart: unless-stopped
    user: postgres                    # start directly as the postgres user, so no capabilities are needed
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD: CHANGE-ME-db-password
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ layout (data lives in /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  lookingglass_data:
