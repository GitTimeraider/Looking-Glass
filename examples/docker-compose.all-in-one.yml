# Everything in one file (no .env, no secret files) - handy for Portainer stacks / Dockge.
# Replace CHANGE-ME before deploying. After the start open http://<docker-host>:8080: the setup wizard asks for the
# setup code (container log), the database (host db, user/database lookingglass, the password below) and your login.
# The password below is only used by PostgreSQL to create the database on the very first start; you can delete the
# POSTGRES_PASSWORD line afterwards (redeploy) so it no longer appears in the stack.
services:
  looking-glass:
    image: ghcr.io/gittimeraider/looking-glass:latest
    container_name: looking-glass
    restart: unless-stopped
    user: "10001:10001"   # uid:gid to run as (change both numbers); must own the data folder
    cap_drop: [ALL]                   # needs no Linux capabilities
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    # No environment needed: database and login are entered in the setup wizard, OPNsense / AI / Zenarmor / Unraid
    # under Settings - all stored encrypted. Do not put passwords or API keys in this file.
    ports:
      - "8080:8080"
      - "514:5514/udp"
      - "514:5514/tcp"
      - "9200:9200"        # Zenarmor Elasticsearch-compatible stream receiver
    volumes:
      - lookingglass_data:/data

  db:
    image: postgres:18
    container_name: looking-glass-db
    restart: unless-stopped
    shm_size: 256mb                   # Docker's default /dev/shm is 64 MB; parallel queries need more
    user: postgres                    # start directly as the postgres user, so no capabilities are needed
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD: CHANGE-ME-db-password   # only read on the first start
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ layout (data lives in /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  lookingglass_data:
