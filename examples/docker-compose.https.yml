# Looking Glass behind Caddy with HTTPS - needed for passkeys (WebAuthn only works on https:// or http://localhost).
#
#   1. Pick a name, e.g. looking-glass.home.lan, and point it (DNS record in OPNsense: Services > Unbound DNS > Overrides)
#      to the Docker host.
#   2. Put it in .env:   LOOKING_GLASS_HOST=looking-glass.home.lan   and   PUBLIC_URL=https://looking-glass.home.lan
#   3. docker compose -f docker-compose.https.yml up -d
#
# Certificates: with `tls internal` (see Caddyfile) Caddy creates its own CA. Install its root certificate on your
# devices once, otherwise browsers show a warning and refuse passkeys:
#   docker cp looking-glass-caddy:/data/caddy/pki/authorities/local/root.crt ./caddy-root.crt
# Have a real domain? Remove `tls internal` and Caddy fetches a Let's Encrypt certificate automatically
# (or use your existing Nginx Proxy Manager / Traefik / SWAG and only the lookingglass + db services below).
services:
  caddy:
    image: caddy:2.11-alpine
    container_name: looking-glass-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      LOOKING_GLASS_HOST: ${LOOKING_GLASS_HOST:?set LOOKING_GLASS_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [looking-glass]

  looking-glass:
    image: ghcr.io/gittimeraider/looking-glass:latest
    container_name: looking-glass
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lookingglass:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/lookingglass
      COOKIE_SECURE: "true"
    expose:
      - "8080"             # only reachable through Caddy
    ports:
      - "514:5514/udp"
      - "514:5514/tcp"
      - "9200:9200"        # Zenarmor Elasticsearch-compatible stream receiver
    volumes:
      - ./data:/data

  db:
    image: postgres:18-alpine
    container_name: looking-glass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ layout (data lives in /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  caddy_data:
