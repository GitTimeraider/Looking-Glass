# Build Looking Glass from source instead of pulling the image (e.g. to test changes):
#   git clone https://github.com/GitTimeraider/Looking-Glass && cd Looking-Glass
#   mkdir -p data secrets && sudo chown 10001:10001 data
#   openssl rand -hex 24 > secrets/db_password && chmod 700 secrets && chmod 644 secrets/db_password
#   docker compose -f examples/docker-compose.build.yml --project-directory . up -d --build
# Then open http://<docker-host>:8080 and follow the setup wizard (setup code: docker logs looking-glass).
services:
  looking-glass:
    build: .
    container_name: looking-glass
    restart: unless-stopped
    user: "${PUID:-10001}:${PGID:-10001}"   # uid:gid to run as (PUID/PGID in .env); must own the data folder
    cap_drop: [ALL]                   # needs no Linux capabilities
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    env_file:              # optional: PUBLIC_URL, LOG_LEVEL ... (see .env.example)
      - path: .env
        required: false
    ports:
      - "8080:8080"
      - "514:5514/udp"
      - "514:5514/tcp"
      - "9200:9200"        # Zenarmor Elasticsearch-compatible stream receiver
    volumes:
      - ./data:/data       # sudo chown -R 10001:10001 ./data (= PUID:PGID)

  db:
    image: postgres:18
    container_name: looking-glass-db
    restart: unless-stopped
    shm_size: 256mb                   # Docker's default /dev/shm is 64 MB; parallel queries need more
    user: postgres                    # start directly as the postgres user, so no capabilities are needed
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [db_password]
    environment:
      POSTGRES_USER: lookingglass
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # read once, when the database is created
      POSTGRES_DB: lookingglass
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18+ layout (data lives in /var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookingglass -d lookingglass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password   # openssl rand -hex 24 > secrets/db_password (see the top of this file)
